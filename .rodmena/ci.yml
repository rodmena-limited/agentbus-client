# RODMENA CI — https://ci.rodmena.co.uk
#
# NOT GitHub Actions. No `on:`, no `if:`, no branch filters — every job runs on
# every build and every pull request. Unknown keys are a hard error.
#
# There is deliberately NO deploy/publish job here: publishing to PyPI is done
# by an operator or a host-side agent, and a publish step in this file would run
# on every branch and every PR.
#
# WHY THIS FILE EXISTS (#47): until 2026-08-22 nothing ran this suite except a
# human typing pytest. The 550-line file-size cap was breached and shipped, and
# tests/ carried 97 lint errors for weeks, because "lint clean" in a commit
# message described whatever scope that author happened to run.

version: 1

concurrency:
  group: ci-${{ ref }}
  cancel_in_progress: true

jobs:
  tests:
    # THE MATRIX IS THE POINT. pyproject declares requires-python = ">=3.10" and
    # the suite had only ever run on one interpreter, so three of the four
    # claimed versions were an untested promise.
    name: "Tests (py${{ matrix.python }})"
    image: rodmenalimited/ci-python:${{ matrix.python }}
    matrix:
      python: ["3.10", "3.11", "3.12", "3.13"]
    timeout_minutes: 20
    steps:
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Tests
        run: uv run pytest -q

  integration:
    # The real client against the real service. SKIPS LOUDLY without a
    # credential rather than passing vacuously — a suite that quietly collects
    # nothing looks identical to one that passed.
    #
    # It needs an UNBOUND credential: an agent-bound key returns 403
    # key_agent_mismatch before the registration precedence logic is reached,
    # which is why the team that owns that code could not test it themselves.
    name: "Integration"
    image: rodmenalimited/ci-python:3.12
    timeout_minutes: 15
    secrets:
      - AGENTBUS_OPERATOR_KEY
    env:
      AGENTBUS_INTEGRATION: "1"
    steps:
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Provide the operator credential
        run: |
          mkdir -p "$HOME/.config/agentbus"
          printf 'export AGENTBUS_API_KEY=%s\n' "$AGENTBUS_OPERATOR_KEY" \
            > "$HOME/.config/agentbus/operator.env"
          chmod 600 "$HOME/.config/agentbus/operator.env"
      - name: Integration tests
        run: uv run pytest tests/integration -q

  lint:
    name: "Lint"
    image: rodmenalimited/ci-python:3.12
    timeout_minutes: 10
    steps:
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  types:
    name: "Types"
    image: rodmenalimited/ci-python:3.12
    timeout_minutes: 10
    steps:
      - name: Install
        run: uv sync --frozen --all-groups
      # Strict over src, tests, scripts and audit, configured in pyproject.toml.
      - name: Mypy (strict)
        run: uv run mypy

  limits:
    # House rules that no tool enforces. Both were breached in the week before
    # this file existed and neither was noticed by anything but a human reading.
    name: "House limits"
    image: rodmenalimited/ci-python:3.12
    timeout_minutes: 5
    steps:
      - name: File size cap (500 soft / 550 hard)
        run: uv run python scripts/check_limits.py
