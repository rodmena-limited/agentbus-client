[project]
name = "rodmena-agentbus"
version = "0.9.105"
description = "AgentBus client — give every coding agent a real inbox and a real email address"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RODMENA LIMITED", email = "hello@rodmena.co.uk" }]
keywords = ["agents", "email", "message bus", "mcp", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24",
    "resilient-circuit>=0.8.6",
    # #234 SEV-1-C: bulkhead for intra-process concurrency isolation. Circuit
    # breaker is ALWAYS OFF (house rule: bulkman with circuit_breaker_enabled=False)
    # — resilient-circuit is where breaker/retry live for network failures; bulkman
    # is the concurrency lane, not a duplicate breaker.
    "bulkman>=2.0.4",
    "segno>=1.6",
    "rich>=13.0",
    # #189 REQUIRED, not optional, and the reasoning matches segno's below.
    #
    # Sealing lives in the client because the private key must never reach the
    # server. A client that installs without cryptography raises
    # ModuleNotFoundError the first time an agent touches an encrypted
    # workspace — at send time, in production, on someone else's machine.
    #
    # Caught by installing the built wheel into a clean venv and CALLING it,
    # rather than by importing from the source tree where cryptography happens
    # to be present. The source tree is not what customers get.
    "cryptography>=42",
    "click>=8.1.7",
]

# segno is REQUIRED again, and the reversal is the point.
#
# It was made an optional `qr` extra to save 544 KB on installs that never render
# a QR. That was correct about the bytes and wrong about the product: `agentbus
# qr` then greeted a user with "install the qr extra" instead of a QR. A command
# whose entire purpose is one thing must not ship unable to do that thing.
#
# The lazy import stays — segno is still imported inside render(), so no command
# that does not draw a QR pays its 23ms. The cost being avoided now is startup
# time, which is real, rather than install size, which was not worth a feature
# that does not work first try.
[project.optional-dependencies]
qr = ["segno>=1.6"]   # kept as a no-op alias so `[qr]` in any doc still resolves

[project.urls]
Homepage = "https://agentbus.rodmena.co.uk"
Documentation = "https://agentbus.rodmena.co.uk/llms.txt"
Repository = "https://github.com/rodmena-limited/agentbus-client"
Issues = "https://github.com/rodmena-limited/agentbus-client/issues"

[project.scripts]
agentbus = "agentbus_client.cli:main"
agentbus-hook = "agentbus_client.hooks.claude_code:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "mutmut==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbus_client"]
# PEP 561: without this marker the annotations we ship are INVISIBLE to
# consumers — mypy reports "module is installed, but missing library stubs or
# py.typed marker" and silently types the whole client as Any. Our own test
# suite hit exactly that (119 errors), which is how it was found.
[tool.hatch.build.targets.wheel.force-include]
"src/agentbus_client/py.typed" = "agentbus_client/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Every exception below is justified in SPECS/0089-strict-lint-and-types.md.
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "PERF203",
    "PLC0415",
    "S603",
    "S607",
    "TRY003",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-self]
extend-ignore-names = [
    "_agent_for",
    "_agent_from_worktree",
    "_agent_slug",
    "_bus",
    "_dispatch",
    "_identity_claim_path",
    "_key_for_agent",
    "_keys_dir",
    "_ledger_path",
    "_project_claude_dir",
    "_read_body",
    "_read_declared_agent",
    "_register_atexit",
    "_repo_root",
    "_request",
    "_resolve_agent_name",
    "_running_watcher_version",
    "_watch_runtime_dir",
    "_worktree_identity_bleed",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts", "audit"]
mypy_path = ["src", "audit/evaluations"]
explicit_package_bases = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401", "ARG", "E402", "PLR2004", "S101", "SLF001"]
"audit/**" = ["ANN401", "ARG", "E402", "INP001", "PLR2004", "SLF001", "T201"]
"scripts/**" = ["INP001", "T201"]
"src/agentbus_client/_watch_*.py" = ["T201"]
"src/agentbus_client/cli/**" = ["T201"]
"src/agentbus_client/client/async_*.py" = ["A002", "PLR0913"]
"src/agentbus_client/client/errors.py" = ["N818"]
"src/agentbus_client/client/sync_*.py" = ["A002", "PLR0913"]
"src/agentbus_client/hooks/**" = ["T201"]
"src/agentbus_client/qr.py" = ["T201"]
"src/agentbus_client/rewake.py" = ["T201"]
"src/agentbus_client/ui.py" = ["T201"]
"src/agentbus_client/watch.py" = ["T201"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/agentbus_client/sealing.py",
    "src/agentbus_client/_signing.py",
    "src/agentbus_client/identity.py",
    "src/agentbus_client/client/sync_verify.py",
    "src/agentbus_client/client/_reply_guard.py",
    "src/agentbus_client/client/attachments.py",
    "src/agentbus_client/client/resilience.py",
    "src/agentbus_client/client/_async_breaker.py",
    "src/agentbus_client/hooks/_gate.py",
    "src/agentbus_client/cli/_sigline.py",
    "src/agentbus_client/cli/_read.py",
    "src/agentbus_client/onboarding/_credentials.py",
]
also_copy = [".gitignore"]
process_isolation = "forkserver"
pytest_add_cli_args_test_selection = ["tests/", "--ignore=tests/integration"]
